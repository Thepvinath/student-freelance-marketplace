spring.application.name=backend
# Railway / Render cấp cổng qua biến PORT; chạy trên máy vẫn là 8080
server.port=${PORT:8080}

# MySQL Connection
# Máy cá nhân: localhost. Khi triển khai: đặt biến môi trường DB_URL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_freelance_marketplace}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do not modify existing database tables
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
